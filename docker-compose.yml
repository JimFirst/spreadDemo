version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: spreadjs-postgres
    environment:
      POSTGRES_USER: spreadjs
      POSTGRES_PASSWORD: spreadjs123
      POSTGRES_DB: spreadjs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: spreadjs-server
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://spreadjs:spreadjs123@postgres:5432/spreadjs
      JWT_SECRET: your-super-secret-jwt-key
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - postgres
    volumes:
      - ./server/logs:/app/logs

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: spreadjs-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_WS_URL: http://localhost:3000
    depends_on:
      - server

volumes:
  postgres_data: